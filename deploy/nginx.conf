limit_req_zone $binary_remote_addr zone=yink_site:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=yink_api:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=yink_login:10m rate=6r/m;
server {
    listen 80;
    server_name leekquant.tech;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://leekquant.tech$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name leekquant.tech;
    ssl_certificate /etc/letsencrypt/live/leekquant.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leekquant.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 250k;
    client_body_timeout 15s;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    limit_req zone=yink_site burst=80 nodelay;
    limit_req_status 429;
    access_log /var/log/nginx/access.log;
    root /srv/yink;
    index index.html;
    location = /_yink_access {
        internal;
        proxy_pass http://127.0.0.1:8766/api/access;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/access { return 404; }
    location ~ ^/api/admin/(login|setup)$ {
        limit_req zone=yink_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
    location /api/ {
        limit_req zone=yink_api burst=12 nodelay;
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_read_timeout 20s;
    }
    location ~ ^/(admin01/?|privacy)$ {
        proxy_pass http://127.0.0.1:8766;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        auth_request /_yink_access;
        try_files $uri $uri/ =404;
        expires 1h;
    }
    location = /index.html {
        auth_request /_yink_access;
        expires -1;
    }
    location ~ /\. { deny all; }
}
